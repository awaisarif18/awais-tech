name: Test and deploy portfolio

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          BUILD_STANDALONE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Smoke-test the standalone server and package the release
        run: |
          set -euo pipefail
          stage=.next/standalone
          cp -R public "$stage/public"
          cp -R .next/static "$stage/.next/static"
          printf '%s\n' "$GITHUB_SHA" > "$stage/public/release.txt"
          (cd "$stage" && exec env HOSTNAME=127.0.0.1 PORT=3210 node server.js) &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:3210/
          for path in survey-theme-analysis pakistan-north-travel-ai overnight-ai-build-lab tradesync-pro; do
            curl -fsS -o /dev/null "http://127.0.0.1:3210/projects/$path"
          done
          curl -fsS -o /dev/null -H 'Accept: image/webp' 'http://127.0.0.1:3210/_next/image?url=%2Fimages%2Fdeparture-horizon-mobile.webp&w=640&q=75'
          test "$(curl -fsS http://127.0.0.1:3210/release.txt)" = "$GITHUB_SHA"
          tar -C "$stage" --exclude='./.next/cache' -czf portfolio-arm64.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          name: portfolio-arm64
          path: portfolio-arm64.tar.gz
          if-no-files-found: error
          retention-days: 3

  production:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: awais-tech-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check that this commit is still current
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $GITHUB_SHA"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.tip.outputs.deploy == 'true'
        with:
          name: portfolio-arm64
      - name: Sign and publish release for Oracle
        if: steps.tip.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.PORTFOLIO_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          tag="production-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already published for $GITHUB_SHA"
            exit 0
          fi
          umask 077
          key=$(mktemp)
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          digest=$(sha256sum portfolio-arm64.tar.gz | cut -d ' ' -f 1)
          jq -n --arg commit "$GITHUB_SHA" --arg sha256 "$digest" '{commit: $commit, sha256: $sha256}' > release.json
          openssl pkeyutl -sign -rawin -inkey "$key" -in release.json -out release.sig
          gh release create "$tag" portfolio-arm64.tar.gz release.json release.sig \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Production ${GITHUB_SHA:0:12}" --notes "Tested Linux ARM64 build for $GITHUB_SHA."
      - name: Verify the Oracle release over HTTPS
        if: steps.tip.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            live=$(curl --silent --fail --max-time 5 https://awaisarif.tech/release.txt || true)
            if [[ "$live" == "$GITHUB_SHA" ]]; then
              curl -fsS --max-time 10 -o /dev/null https://awaisarif.tech/
              for path in survey-theme-analysis pakistan-north-travel-ai overnight-ai-build-lab tradesync-pro; do
                curl -fsS --max-time 10 -o /dev/null "https://awaisarif.tech/projects/$path"
              done
              curl -fsS --max-time 10 -o /dev/null -H 'Accept: image/webp' 'https://awaisarif.tech/_next/image?url=%2Fimages%2Fdeparture-horizon-mobile.webp&w=640&q=75'
              printf 'Verified commit `%s` at https://awaisarif.tech\n' "$live" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( attempt % 6 == 0 )); then
              tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
              if [[ "$tip" != "$GITHUB_SHA" ]]; then
                echo "Superseded while waiting for Oracle"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Oracle did not serve $GITHUB_SHA at the public HTTPS URL" >&2
          exit 1
